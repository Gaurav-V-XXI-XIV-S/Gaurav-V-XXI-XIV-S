name: Generate GitHub Stats

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: mkdir -p generated

      - name: Fetch live GitHub stats
        env:
          USERNAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          curl --fail --location \
            "https://github-readme-stats.vercel.app/api?username=${USERNAME}&show_icons=true&hide_title=true&hide_border=true&include_all_commits=true" \
            -o generated/stats.svg
          curl --fail --location \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=${USERNAME}&layout=compact&hide_border=true" \
            -o generated/langs.svg

          cp generated/stats.svg generated/stats-light.svg
          cp generated/stats.svg generated/stats-dark.svg
          cp generated/langs.svg generated/langs-light.svg
          cp generated/langs.svg generated/langs-dark.svg

      - name: Commit generated assets
        uses: EndBug/add-and-commit@v9
        with:
          add: "generated"
          message: "chore: update GitHub telemetry"
